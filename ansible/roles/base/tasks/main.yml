---
- name: Refresh apt cache (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false   
  when: ansible_facts['os_family'] == "Debian"

- name: Refresh apk index (Alpine)
  community.general.apk:
    update_cache: true
  changed_when: false  
  when: ansible_facts['os_family'] == "Alpine"

- name: Upgrade packages (Debian, opt-in)
  ansible.builtin.apt:
    upgrade: safe
  when:
    - base_upgrade_packages | bool
    - ansible_facts['os_family'] == "Debian"

- name: Upgrade packages (Alpine, opt-in)
  community.general.apk:
    upgrade: true
  when:
    - base_upgrade_packages | bool
    - ansible_facts['os_family'] == "Alpine"

- name: Install base packages (Debian)
  ansible.builtin.apt:
    name: [vim, curl, htop, rsync, qemu-guest-agent]
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Install base packages (Alpine)
  community.general.apk:
    name: [vim, curl, htop, rsync]
    state: present
  when: ansible_facts['os_family'] == "Alpine"

- name: Set hostname
  ansible.builtin.hostname:
    name: "lab-{{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  when: ansible_facts['os_family'] == "Debian"
