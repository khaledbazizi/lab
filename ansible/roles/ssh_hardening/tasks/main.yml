---
- name: SSH service name
  ansible.builtin.set_fact:
    ssh_hardening_service: "{{ 'sshd' if ansible_facts['os_family'] == 'Alpine' else 'ssh' }}"

- name: Check if drop-in dir exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

- name: Check sshd read drop-in files
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/'
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF

- name: Deploy hardening settings
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      Port {{ lab_ssh_port | default(22) }}
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd
