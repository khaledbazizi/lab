---
- name: WireGuard VPN
  when: wireguard_enabled | bool
  block:
    - name: Load OS variables
      ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

    - name: Install WireGuard tools
      ansible.builtin.package:
        name: "{{ wireguard_packages }}"
        state: present

    - name: Create the config folder
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate the server private key (once)
      ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/server.key
      args:
        creates: /etc/wireguard/server.key

    - name: Derive the server public key (once)
      ansible.builtin.shell: wg pubkey < /etc/wireguard/server.key > /etc/wireguard/server.pub
      args:
        creates: /etc/wireguard/server.pub

    - name: Read the server private key
      ansible.builtin.slurp:
        src: /etc/wireguard/server.key
      register: wireguard_key_file
      no_log: true

    - name: Deploy the tunnel config
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart WireGuard

    - name: Link the OpenRC service for wg0 (Alpine)
      ansible.builtin.file:
        src: /etc/init.d/wg-quick
        dest: /etc/init.d/wg-quick.wg0
        state: link
      when: ansible_facts['os_family'] == "Alpine"

    - name: Enable the tunnel at boot and start it
      ansible.builtin.service:
        name: "{{ wireguard_service }}"
        enabled: true
        state: started
